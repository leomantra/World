let reqTab='received';
function renderRequests(mc){
  mc.innerHTML=`
  <div class="top-bar"><span class="top-bar-title">💌 Requests</span></div>
  <div class="tab-bar">
    <div class="tab-item ${reqTab==='received'?'active':''}" onclick="setReqTab('received')">Received (${receivedRequests.length})</div>
    <div class="tab-item ${reqTab==='sent'?'active':''}" onclick="setReqTab('sent')">Sent (${sentRequests.length})</div>
    <div class="tab-item ${reqTab==='shortlist'?'active':''}" onclick="setReqTab('shortlist')">Shortlist</div>
  </div>
  <div class="scrollable" style="padding:12px 16px 100px" id="req-list">
    ${renderReqList()}
  </div>`;
}
function setReqTab(t){reqTab=t;document.querySelectorAll('.tab-item').forEach((el,i)=>{el.classList.toggle('active',['received','sent','shortlist'][i]===t)});document.getElementById('req-list').innerHTML=renderReqList();}
function renderReqList(){
  let ids=reqTab==='received'?receivedRequests:reqTab==='sent'?sentRequests:likedIds;
  if(!ids.length)return`<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">${reqTab==='received'?'💌':reqTab==='sent'?'📤':'⭐'}</div><div style="font-size:16px;font-weight:600">No ${reqTab} requests</div></div>`;
  return ids.map(id=>{
    const p=PROFILES.find(x=>x.id===id);if(!p)return'';
    const isReceived=reqTab==='received';
    return`<div class="req-card">
      <img src="${p.img}" class="req-img" onclick="openProfileView(${p.id})" style="cursor:pointer"/>
      <div class="req-info">
        <div class="req-name">${p.name}, ${p.age}</div>
        <div class="req-detail">${p.profession} · ${p.city}</div>
        <div class="req-detail" style="margin-top:2px">${p.religion} · ${p.height} · ${p.edu.split(',')[0]}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
        ${isReceived?`
          <button class="btn btn-sm" style="background:var(--c);color:#fff;border:none;cursor:pointer" onclick="acceptRequest(${p.id})">✓ Accept</button>
          <button class="btn btn-sm" style="background:#fce4ec;color:#c62828;border:none;cursor:pointer" onclick="rejectRequest(${p.id})">✕ Decline</button>
        `:`<span class="req-status status-sent">Sent</span>
          <button class="btn btn-sm btn-outline" style="font-size:12px;border-radius:10px;border:1.5px solid var(--c);background:transparent;color:var(--c);cursor:pointer;padding:6px 10px" onclick="openChat(${p.id})">💬 Chat</button>`}
      </div>
    </div>`;
  }).join('');
}
function acceptRequest(id){
  receivedRequests=receivedRequests.filter(x=>x!==id);
  likedIds.push(id);
  document.getElementById('req-list').innerHTML=renderReqList();
  showToast('✅ Request accepted! You can now chat.');
  document.getElementById('req-badge').textContent=receivedRequests.length||'';
}
function rejectRequest(id){
  receivedRequests=receivedRequests.filter(x=>x!==id);
  document.getElementById('req-list').innerHTML=renderReqList();
  showToast('Request declined');
  document.getElementById('req-badge').textContent=receivedRequests.length||'';
}

