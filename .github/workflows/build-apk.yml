function renderMessenger(mc){
  const chatProfiles=[...likedIds,...sentRequests].filter((v,i,a)=>a.indexOf(v)===i).map(id=>PROFILES.find(p=>p.id===id)).filter(Boolean);
  mc.innerHTML=`
  <div class="top-bar"><span class="top-bar-title">💬 Messages</span></div>
  <div style="padding:10px 16px 6px;flex-shrink:0">
    <div style="display:flex;align-items:center;background:#fff;border-radius:12px;padding:9px 14px;border:1.5px solid var(--border);gap:8px">
      <span style="font-size:16px">🔍</span>
      <input style="flex:1;border:none;outline:none;font-size:14px;font-family:'DM Sans',sans-serif;background:transparent" placeholder="Search messages…"/>
    </div>
  </div>
  <div class="scrollable" style="padding-bottom:100px">
    ${chatProfiles.length===0?`<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:48px">💬</div><div style="margin-top:12px;font-size:15px;font-weight:600">No conversations yet</div><div style="font-size:13px;margin-top:6px">Accept requests or send interests to start chatting</div></div>`:''}
    ${chatProfiles.map(p=>`
    <div class="chat-item" onclick="openChat(${p.id})">
      <div style="position:relative">
        <img src="${p.img}" class="chat-ava" alt="${p.name}" style="width:50px;height:50px;border-radius:50%;object-fit:cover"/>
        ${p.online?'<div class="chat-online"></div>':''}
      </div>
      <div class="chat-info">
        <div class="chat-name">${p.name}</div>
        <div class="chat-preview">${chatHistory[p.id]?chatHistory[p.id].slice(-1)[0].text:'Tap to start chatting ✨'}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">10:37 AM</div>
        ${!chatHistory[p.id]?'<div class="chat-unread">1</div>':''}
      </div>
    </div>`).join('')}
  </div>`;
}
function openChat(id){
  const p=PROFILES.find(x=>x.id===id);if(!p)return;
  activeChatId=id;
  if(!chatHistory[id])chatHistory[id]=[...CHAT_SEED];
  document.getElementById('cs-img').src=p.img;
  document.getElementById('cs-name').textContent=p.name;
  renderChatMessages();
  document.getElementById('chat-screen').classList.add('active');
  document.getElementById('msg-badge').style.display='none';
}
function closeChat(){document.getElementById('chat-screen').classList.remove('active');}
function renderChatMessages(){
  const msgs=chatHistory[activeChatId]||[];
  const wrap=document.getElementById('cs-msgs');
  wrap.innerHTML=msgs.map(m=>`<div class="msg-row ${m.from}"><div class="bubble ${m.from}">${m.text}<div class="msg-time">${m.time}</div></div></div>`).join('');
  wrap.scrollTop=wrap.scrollHeight;
}
function sendChatMsg(){
  const inp=document.getElementById('cs-input');
  const txt=inp.value.trim();if(!txt)return;
  if(!chatHistory[activeChatId])chatHistory[activeChatId]=[];
  const now=new Date();
  chatHistory[activeChatId].push({from:'me',text:txt,time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')});
  inp.value='';renderChatMessages();
}

