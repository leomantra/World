        <div class="pv-item"><div class="pv-item-key">${k}</div><div class="pv-item-val">${v}</div></div>`).join('')}
      </div>
    </div>
    <div class="pv-section">
      <div class="pv-section-title">Photos</div>
      <div class="pv-photos">
        ${[1,2,3].map(i=>`<img src="${p.img.replace('400','300')}?rand=${i}" class="pv-photo" alt="photo"/>`).join('')}
      </div>
    </div>
    <div style="padding:16px 0;display:flex;gap:10px">
      <button class="act-btn act-ignore" style="flex:1;padding:12px" onclick="ignoreProfile(${p.id});document.getElementById('profile-view').classList.remove('active')">✕ Ignore</button>
