// ═══════════════════════════════════════════════════════
//  REGISTER WIZARD
// ═══════════════════════════════════════════════════════
let regStep=1; const REG_TOTAL=5;
const regSteps=[
  {title:'Select Gender',sub:'Who are you looking for?'},
  {title:'Your Details',sub:'Tell us about yourself'},
  {title:'Partner Preference',sub:'What are you looking for?'},
  {title:'Add Your Photo',sub:'Profiles with photos get 10x more responses'},
  {title:'Location & Preference',sub:'Help us find matches near you'},
];
function renderRegStep(){
  const pct=((regStep)/REG_TOTAL)*100;
  document.getElementById('reg-prog').style.width=pct+'%';
  document.getElementById('reg-step-lbl').textContent=regStep+' / '+REG_TOTAL;
  const body=document.getElementById('reg-body');
  const s=regSteps[regStep-1];
  let html=`<div class="reg-title">${s.title}</div><div class="reg-sub">${s.sub}</div>`;
  if(regStep===1){
    html+=`<div class="gender-grid">
      <div class="gender-opt sel" onclick="selGender(this,'male')"><div class="gender-emoji">👨</div><div class="gender-label">Male</div></div>
      <div class="gender-opt" onclick="selGender(this,'female')"><div class="gender-emoji">👩</div><div class="gender-label">Female</div></div>
      <div class="gender-opt" onclick="selGender(this,'other')"><div class="gender-emoji">🧑</div><div class="gender-label">Non-Binary</div></div>
    </div>
    <div class="form-group"><label class="form-label">Looking For</label>
    <select class="form-input form-select"><option>Bride (Female)</option><option>Groom (Male)</option><option>Any Gender</option></select></div>`;
  } else if(regStep===2){
    html+=`<div class="form-group"><label class="form-label">Full Name</label><input class="form-input" placeholder="Your full name"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Date of Birth</label><input class="form-input" type="date"/></div>
      <div class="form-group"><label class="form-label">Height</label><select class="form-input form-select"><option>5'0"</option><option>5'2"</option><option>5'4"</option><option>5'6"</option><option>5'8"</option><option>5'10"</option><option>6'0"</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Religion</label><select class="form-input form-select"><option>Hindu</option><option>Muslim</option><option>Christian</option><option>Sikh</option><option>Jain</option><option>Buddhist</option><option>Other</option></select></div>
    <div class="form-group"><label class="form-label">Mother Tongue</label><select class="form-input form-select"><option>Hindi</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Marathi</option><option>Bengali</option><option>Gujarati</option><option>Punjabi</option><option>Urdu</option></select></div>
    <div class="form-group"><label class="form-label">Marital Status</label><select class="form-input form-select"><option>Never Married</option><option>Divorced</option><option>Widowed</option><option>Awaiting Divorce</option></select></div>`;
  } else if(regStep===3){
    html+=`<div class="form-group"><label class="form-label">Profession</label><input class="form-input" placeholder="e.g. Software Engineer"/></div>
    <div class="form-group"><label class="form-label">Education</label><input class="form-input" placeholder="e.g. B.Tech, IIT Bombay"/></div>
    <div class="form-group"><label class="form-label">Annual Income</label><select class="form-input form-select"><option>Below 3 LPA</option><option>3-5 LPA</option><option>5-8 LPA</option><option>8-12 LPA</option><option>12-20 LPA</option><option>20+ LPA</option></select></div>
    <div class="form-group"><label class="form-label">Diet</label><select class="form-input form-select"><option>Vegetarian</option><option>Non-Vegetarian</option><option>Eggetarian</option><option>Vegan</option></select></div>
    <div class="form-group"><label class="form-label">About Me</label><textarea class="form-input" placeholder="Write something about yourself…"></textarea></div>`;
  } else if(regStep===4){
    html+=`<div class="photo-upload" id="photo-upload-box" onclick="triggerPhotoUpload()">
      <img id="photo-preview" class="photo-preview"/>
      <div id="photo-placeholder" style="text-align:center">
        <div style="font-size:40px;margin-bottom:8px">📸</div>
        <div style="font-size:14px;font-weight:600;color:var(--dark)">Tap to upload photo</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">JPG, PNG up to 5MB</div>
      </div>
    </div>
    <input type="file" id="photo-file-input" accept="image/*" style="display:none" onchange="previewPhoto(this)"/>
    <div style="margin-top:16px;font-size:13px;color:var(--muted);text-align:center">✨ Tip: Profiles with clear face photos get 10x more attention</div>`;
  } else if(regStep===5){
    html+=`<div class="form-group"><label class="form-label">Your City</label><input class="form-input" placeholder="City" value="Mumbai"/></div>
    <div class="form-group"><label class="form-label">Your State</label><select class="form-input form-select"><option>Maharashtra</option><option>Delhi</option><option>Karnataka</option><option>Tamil Nadu</option><option>Telangana</option><option>Kerala</option><option>Gujarat</option><option>Rajasthan</option><option>Punjab</option><option>West Bengal</option></select></div>
    <div class="form-group">
      <label class="form-label">Search Radius — <span id="radius-val-reg">50 km</span></label>
      <input type="range" min="10" max="500" value="50" oninput="document.getElementById('radius-val-reg').textContent=this.value+' km'"/>
    </div>
    <div class="form-group"><label class="form-label">Partner Age Range</label>
      <div class="form-row">
        <input class="form-input" placeholder="Min age" type="number" value="22"/>
        <input class="form-input" placeholder="Max age" type="number" value="32"/>
      </div>
    </div>`;
  }
  html+=`<div style="display:flex;gap:10px;margin-top:20px;padding-bottom:20px">
    ${regStep>1?`<button class="btn btn-outline" style="flex:1" onclick="regStep--;renderRegStep()">← Back</button>`:''}
    <button class="btn btn-red" style="flex:2" onclick="${regStep<REG_TOTAL?'regStep++;renderRegStep()':'completeReg()'}">
      ${regStep<REG_TOTAL?'Continue →':'Complete Registration 🎉'}</button>
  </div>`;
  body.innerHTML=html;
}
function selGender(el,g){document.querySelectorAll('.gender-opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
function triggerPhotoUpload(){document.getElementById('photo-file-input').click();}
function previewPhoto(inp){
  const file=inp.files[0];if(!file)return;
  const url=URL.createObjectURL(file);
  document.getElementById('photo-preview').src=url;
  document.getElementById('photo-preview').style.display='block';
  document.getElementById('photo-placeholder').style.display='none';
}
function completeReg(){showToast('Profile created! Welcome to Jodi.in 🎉');setTimeout(()=>{goTo('main');renderTab('home');},800);}

