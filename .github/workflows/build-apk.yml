function renderDiscoverGrid(profiles){
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${profiles.map(p=>`
    <div style="border-radius:16px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.1)" onclick="openProfileView(${p.id})">
      <img src="${p.img}" style="width:100%;height:190px;object-fit:cover;display:block"/>
      <div style="position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(transparent,rgba(20,6,8,.88))"></div>
      ${p.verified?'<div style="position:absolute;top:8px;left:8px;background:#00c853;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">✓</div>':''}
      <div style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff">${p.match}%</div>
      <div style="position:absolute;bottom:22px;left:10px;right:10px;color:#fff">
        <div style="font-weight:700;font-size:13px">${p.name.split(' ')[0]}, ${p.age}</div>
        <div style="font-size:10px;opacity:.8">${p.city}</div>
      </div>
      <button style="position:absolute;bottom:8px;right:8px;background:${sentRequests.includes(p.id)?'var(--c)':'rgba(255,255,255,.25)'};border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();sendInterest(${p.id})">${sentRequests.includes(p.id)?'✓':'♥'}</button>
    </div>`).join('')}
  </div>`;
}
function filterDiscover(q){
  const filtered=PROFILES.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.city.toLowerCase().includes(q.toLowerCase())||p.profession.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('disc-grid').innerHTML=renderDiscoverGrid(filtered);
}
function filterDiscoverTag(tag,el){
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  const filtered=tag==='All'?PROFILES:PROFILES.filter(p=>p.city===tag||p.religion===tag||p.profession.includes(tag));
  document.getElementById('disc-grid').innerHTML=renderDiscoverGrid(filtered);
}

