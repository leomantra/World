function openFilter(){
  document.getElementById('filter-content').innerHTML=`
  <div class="form-group">
    <label class="form-label">Age Range — <span id="age-range-lbl">${filterSettings.ageMin}–${filterSettings.ageMax} yrs</span></label>
    <div style="display:flex;gap:12px;align-items:center">
      <input type="range" min="18" max="50" value="${filterSettings.ageMin}" style="flex:1" oninput="filterSettings.ageMin=+this.value;document.getElementById('age-range-lbl').textContent=filterSettings.ageMin+'–'+filterSettings.ageMax+' yrs'"/>
      <input type="range" min="18" max="60" value="${filterSettings.ageMax}" style="flex:1" oninput="filterSettings.ageMax=+this.value;document.getElementById('age-range-lbl').textContent=filterSettings.ageMin+'–'+filterSettings.ageMax+' yrs'"/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Max Distance — <span id="dist-lbl">${filterSettings.distanceMax} km</span></label>
    <input type="range" min="5" max="500" value="${filterSettings.distanceMax}" oninput="filterSettings.distanceMax=+this.value;document.getElementById('dist-lbl').textContent=this.value+' km'"/>
  </div>
  <div class="form-group"><label class="form-label">Religion</label>
    <select class="form-input form-select" onchange="filterSettings.religion=this.value">
      ${['Any','Hindu','Muslim','Christian','Sikh','Jain','Buddhist'].map(r=>`<option ${filterSettings.religion===r?'selected':''}>${r}</option>`).join('')}
    </select>
  </div>
  <div class="form-group"><label class="form-label">Annual Income</label>
    <select class="form-input form-select" onchange="filterSettings.income=this.value">
      ${['Any','Below 3 LPA','3-5 LPA','5-10 LPA','10-20 LPA','20+ LPA'].map(r=>`<option ${filterSettings.income===r?'selected':''}>${r}</option>`).join('')}
    </select>
  </div>
  <div class="form-group"><label class="form-label">Diet</label>
    <select class="form-input form-select" onchange="filterSettings.diet=this.value">
      ${['Any','Vegetarian','Non-Vegetarian','Eggetarian','Vegan'].map(r=>`<option ${filterSettings.diet===r?'selected':''}>${r}</option>`).join('')}
    </select>
  </div>
  <div class="form-group"><label class="form-label">Gender</label>
    <div style="display:flex;flex-wrap:wrap">
      ${['Female','Male','Non-Binary','Any'].map(g=>`<span class="filter-chip ${g==='Female'?'sel':''}" onclick="document.querySelectorAll('.filter-chip').forEach(c=>{if(c.parentElement===this.parentElement)c.classList.remove('sel')});this.classList.add('sel')">${g}</span>`).join('')}
    </div>
  </div>
  <div class="form-group"><label class="form-label">Marital Status</label>
    <div style="display:flex;flex-wrap:wrap">
      ${['Any','Never Married','Divorced','Widowed'].map(g=>`<span class="filter-chip ${g==='Never Married'?'sel':''}" onclick="document.querySelectorAll('[data-ms]').forEach(c=>c.classList.remove('sel'));this.classList.add('sel')" data-ms="${g}">${g}</span>`).join('')}
    </div>
  </div>`;
  document.getElementById('filter-panel').classList.add('open');
}
function closeFilter(){document.getElementById('filter-panel').classList.remove('open');}
function applyFilter(){closeFilter();showToast('✅ Filters applied! '+PROFILES.filter(p=>p.age>=filterSettings.ageMin&&p.age<=filterSettings.ageMax&&p.distance<=filterSettings.distanceMax).length+' profiles found');}
function resetFilter(){filterSettings={ageMin:18,ageMax:60,heightMin:140,heightMax:200,religion:'Any',income:'Any',diet:'Any',distanceMax:500};showToast('Filters reset');}

