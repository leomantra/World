function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('bnav-'+tab);if(btn)btn.classList.add('active');
  renderTab(tab);
}
function renderTab(tab){
  const mc=document.getElementById('main-content');
  mc.innerHTML='';
  if(tab==='home') renderHome(mc);
  else if(tab==='discover') renderDiscover(mc);
  else if(tab==='requests') renderRequests(mc);
  else if(tab==='messenger') renderMessenger(mc);
  else if(tab==='menu') renderMenu(mc);
  else if(tab==='activity') renderActivity(mc);
  else if(tab==='profile') renderMyProfile(mc);
  else if(tab==='edit-profile') renderEditProfile(mc);
  else if(tab==='settings') renderSettings(mc);
  else if(tab==='privacy') renderPrivacy(mc);
  else if(tab==='help') renderHelp(mc);
  else if(tab==='location') openLocationPanel();
}

