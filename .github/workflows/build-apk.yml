    <span class="top-bar-title">🔒 Privacy Settings</span>
  </div>
  <div class="scrollable" style="padding:16px 16px 100px">
    <div class="white-card">
      <div class="pv-section-title" style="margin-bottom:12px">Contact Visibility</div>
      ${[['Show Phone Number','showPhone'],['Show Email Address','showEmail']].map(([l,k])=>`
      <div class="setting-row">
        <div class="setting-icon" style="background:var(--bg)">${k==='showPhone'?'📱':'📧'}</div>
        <div style="flex:1"><div class="setting-label">${l}</div><div style="font-size:11px;color:var(--muted)">Only matches can see</div></div>
        <button class="toggle ${privacyToggles[k]?'on':''}" id="ptog-${k}" onclick="togglePrivacy('${k}')"></button>
      </div>`).join('')}
    </div>
    <div class="white-card">
      <div class="pv-section-title" style="margin-bottom:12px">Activity Status</div>
      ${[['Show Last Seen','showLastSeen'],['Show Online Status','showOnline'],['Profile Visible to Others','profileVisible'],['Hide from Contacts','hideFromContacts']].map(([l,k])=>`
      <div class="setting-row">
        <div class="setting-icon" style="background:var(--bg)">${k==='showLastSeen'?'🕐':k==='showOnline'?'🟢':k==='profileVisible'?'👁':'🙈'}</div>
        <span class="setting-label">${l}</span>
        <button class="toggle ${privacyToggles[k]?'on':''}" id="ptog-${k}" onclick="togglePrivacy('${k}')"></button>
      </div>`).join('')}
    </div>
    <div class="white-card">
      <div class="pv-section-title" style="margin-bottom:12px">Messaging</div>
      <div class="setting-row">
        <div class="setting-icon" style="background:var(--bg)">💬</div>
        <div style="flex:1"><div class="setting-label">Who Can Message Me</div></div>
      </div>
      ${['Everyone','Matches Only','No One'].map(opt=>`
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer" onclick="privacyToggles.whoCanMsg='${opt}';renderPrivacy(document.getElementById('main-content'))">
        <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${privacyToggles.whoCanMsg===opt?'var(--c)':'var(--border)'};display:flex;align-items:center;justify-content:center">
          ${privacyToggles.whoCanMsg===opt?'<div style="width:10px;height:10px;border-radius:50%;background:var(--c)"></div>':''}
        </div>
        <span style="font-size:14px;color:var(--dark)">${opt}</span>
      </div>`).join('')}
    </div>
    <div class="white-card">
      <div class="pv-section-title" style="margin-bottom:12px">Blocked Profiles</div>
      <div style="text-align:center;padding:20px;color:var(--muted)">
        <div style="font-size:32px;margin-bottom:8px">🚫</div>
        <div style="font-size:14px">No blocked profiles</div>
      </div>
    </div>
    <button class="btn btn-red" onclick="showToast('✅ Privacy settings saved')">Save Privacy Settings</button>
  </div>`;
}
function togglePrivacy(k){
  privacyToggles[k]=!privacyToggles[k];
  const btn=document.getElementById('ptog-'+k);
  if(btn)btn.classList.toggle('on',privacyToggles[k]);
  showToast(privacyToggles[k]?'Enabled':'Disabled');
}

