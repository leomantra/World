const ADMIN_CREDS = { username: 'Akhilesh', password: 'Akhil@123' };

function openAdminLoginModal(){
  const modal = document.getElementById('admin-login-modal');
  modal.style.display = 'flex';
  document.getElementById('admin-username').value = '';
  document.getElementById('admin-password').value = '';
  document.getElementById('admin-login-err').style.display = 'none';
  setTimeout(()=>document.getElementById('admin-username').focus(), 300);
}
function closeAdminLoginModal(){
  document.getElementById('admin-login-modal').style.display = 'none';
}
function toggleAdminPwd(){
  const inp = document.getElementById('admin-password');
  const eye = document.getElementById('admin-pwd-eye');
  if(inp.type === 'password'){ inp.type = 'text'; eye.textContent = '🙈'; }
  else { inp.type = 'password'; eye.textContent = '👁'; }
}
function doAdminLogin(){
  const uname = (document.getElementById('admin-username')||{}).value;
  const pwd   = (document.getElementById('admin-password')||{}).value;
  const errEl  = document.getElementById('admin-login-err');
  if(!uname || !pwd){ if(errEl) errEl.style.display='block'; return; }
  if(uname.trim() === ADMIN_CREDS.username && pwd === ADMIN_CREDS.password){
    if(errEl) errEl.style.display = 'none';
    closeAdminLoginModal();
    isAdmin = true;
    goTo('admin-panel');
    renderAdmin();
    showToast('✅ Welcome, ' + uname.trim() + '! Admin access granted.');
  } else {
    if(errEl) errEl.style.display = 'block';
    const pwdEl = document.getElementById('admin-password');
    if(pwdEl){ pwdEl.value = ''; pwdEl.focus(); }
  }
}
