function renderDiscover(mc){
  mc.innerHTML=`
  <div class="top-bar">
    <span class="top-bar-title">🔍 Discover</span>
    <button class="icon-btn" onclick="openFilter()">🎚 Filter</button>
    <button class="icon-btn" onclick="openLocationPanel()">📍</button>
  </div>
  <div style="padding:12px 16px 8px;flex-shrink:0">
    <div style="display:flex;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;border:1.5px solid var(--border);gap:10px">
      <span style="font-size:18px">🔍</span>
      <input style="flex:1;border:none;outline:none;font-size:14px;font-family:'DM Sans',sans-serif;background:transparent" placeholder="Search by name, city, profession…" oninput="filterDiscover(this.value)" id="disc-search"/>
    </div>
    <!-- Quick Filters -->
    <div style="display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none">
