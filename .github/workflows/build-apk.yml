    <label class="form-label" style="display:flex;justify-content:space-between">
      <span>Search Radius (Diameter)</span>
      <span id="radius-display" style="color:var(--c);font-weight:600">${locationSettings.radius} km</span>
    </label>
    <input type="range" min="5" max="500" value="${locationSettings.radius}" id="radius-slider" oninput="locationSettings.radius=+this.value;document.getElementById('radius-display').textContent=this.value+' km';document.querySelector('.map-radius span').textContent=this.value+'km'"/>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px"><span>5 km</span><span>500 km</span></div>
  </div>
  <div style="background:var(--bg);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:16px">
    📊 Estimated profiles in range: <span style="color:var(--c);font-weight:700">${Math.floor(locationSettings.radius * 2.4)}</span> profiles
  </div>
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <button class="btn btn-outline" style="flex:1;padding:10px;font-size:13px;border-radius:12px" onclick="showToast('Getting your location…')">📍 Auto-detect</button>
    <button class="btn btn-outline" style="flex:1;padding:10px;font-size:13px;border-radius:12px" onclick="showToast('Opening map…')">🗺 Pick on Map</button>
  </div>`;
  document.getElementById('location-panel').classList.add('open');
}
function saveLocation(){
  locationSettings.city=document.getElementById('loc-city').value;
  locationSettings.state=document.getElementById('loc-state').value;
  document.getElementById('location-panel').classList.remove('open');
  showToast('📍 Location settings saved!');
}

