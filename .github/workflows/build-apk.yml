    {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%23B5121B'/%3E%3Ctext x='256' y='360' font-size='300' text-anchor='middle' fill='white'%3E%E2%99%A5%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml"}]};
const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
const mLink=document.createElement('link');mLink.rel='manifest';mLink.href=URL.createObjectURL(mBlob);document.head.appendChild(mLink);

if('serviceWorker' in navigator){
  const sw=`const C='jodi-v2';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
  const swBlob=new Blob([sw],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  setTimeout(()=>{
    const b=document.createElement('div');
    b.style.cssText='position:fixed;bottom:72px;left:12px;right:12px;background:linear-gradient(135deg,#B5121B,#E8354A);border-radius:16px;padding:14px 16px;z-index:9000;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(181,18,27,.4);animation:sheetUp .4s ease';
