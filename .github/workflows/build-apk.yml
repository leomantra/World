let selPlan='gold';
function openPayment(){
  document.getElementById('payment-content').innerHTML=`
  <div style="text-align:center;margin-bottom:16px">
    <div style="font-size:13px;color:var(--muted)">Unlock premium features and find your perfect match faster</div>
  </div>
  ${[
    {id:'silver',name:'Silver',price:'₹499',period:'/month',features:'50 Interests/day\nSee who viewed\nBasic filters\nChat with matches',popular:false},
    {id:'gold',name:'Gold',price:'₹999',period:'/month',features:'Unlimited Interests\nPriority in search\nAdvanced filters\nVideo calling\nProfile boost',popular:true},
    {id:'platinum',name:'Platinum',price:'₹2499',period:'/3 months',features:'Everything in Gold\nPersonalized matchmaking\nDedicated relationship manager\nBackground verification\nAI compatibility report',popular:false},
  ].map(p=>`
  <div class="plan-card ${selPlan===p.id?'selected':''} ${p.popular?'popular':''}" onclick="selPlan='${p.id}';document.querySelectorAll('.plan-card').forEach(c=>{c.classList.toggle('selected',c.getAttribute('onclick').includes('${p.id}'))})">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="plan-name">👑 ${p.name}</div><div class="plan-price">${p.price}<span style="font-size:14px;color:var(--muted)">${p.period}</span></div></div>
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${selPlan===p.id?'var(--c)':'var(--border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${selPlan===p.id?'<div style="width:12px;height:12px;border-radius:50%;background:var(--c)"></div>':''}
      </div>
    </div>
    <div class="plan-features">${p.features.split('\n').map(f=>`✓ ${f}`).join('<br/>')}</div>
  </div>`).join('')}
  <div class="white-card">
    <div style="font-size:15px;font-weight:600;color:var(--dark);margin-bottom:12px">💳 Payment Method</div>
    ${['UPI (GPay, PhonePe, Paytm)','Credit / Debit Card','Net Banking','EMI Options'].map((m,i)=>`
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer">
      <span style="font-size:20px">${['📱','💳','🏦','🔄'][i]}</span>
      <span style="font-size:14px;font-weight:500;flex:1">${m}</span>
      <span style="color:#ccc">›</span>
    </div>`).join('')}
  </div>
  <button class="btn btn-gold" onclick="completePurchase()">💳 Proceed to Pay</button>
  <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:10px">🔒 Secured by Razorpay · Auto-renewal can be cancelled anytime</p>`;
  document.getElementById('payment-panel').classList.add('open');
}
function completePurchase(){
  document.getElementById('payment-panel').classList.remove('open');
  showToast('🎉 Payment successful! Premium activated.',3000);
  ME.premium=true;
}

