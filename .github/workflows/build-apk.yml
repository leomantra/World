name: Build Jodi.in APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/splash-screen @capacitor/status-bar

      - name: Copy web assets
        run: |
          mkdir -p www
          cp Jodi-in-PWA-Complete.html www/index.html

      - name: Init Capacitor
        run: npx cap init "Jodi.in" "in.jodi.app" --web-dir www

      - name: Copy capacitor config
        run: cp capacitor.config.json .

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: Jodi-in-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-release:
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Copy web assets
        run: |
          mkdir -p www
          cp Jodi-in-PWA-Complete.html www/index.html

      - name: Setup Capacitor
        run: |
          npx cap init "Jodi.in" "in.jodi.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore jodi-release.keystore \
            -alias jodi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Jodi.in, OU=Mobile, O=Jodi, L=Mumbai, ST=Maharashtra, C=IN" \
            -storepass jodi2024secure \
            -keypass jodi2024secure

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=../jodi-release.keystore \
            -Pandroid.injected.signing.store.password=jodi2024secure \
            -Pandroid.injected.signing.key.alias=jodi \
            -Pandroid.injected.signing.key.password=jodi2024secure

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: Jodi-in-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
