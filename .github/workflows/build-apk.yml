    <div style="flex:1">
      <div style="font-size:12px;color:var(--muted)">Good Morning 🌸</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--dark)">${ME.name}</div>
    </div>
    <button class="icon-btn" onclick="openLocationPanel()">📍</button>
    <button class="icon-btn" onclick="openFilter()">🎚</button>
    <button class="icon-btn" style="position:relative" onclick="switchTab('activity')">🔔<span style="position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--c);border-radius:50%;border:1.5px solid #fff"></span></button>
    <img src="${ME.img}" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;cursor:pointer" onclick="switchTab('profile')"/>
  </div>
  <div class="scrollable" style="padding:14px 16px 100px">
    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      ${[['47','Visitors','#fff3e0','#e65100'],['12','Sent','#e3f2fd','#1565c0'],['3','Received','#f3e5f5','#7b1fa2'],['5','Matches','#e8f5e9','#2e7d32']].map(([n,l,bg,col])=>`
      <div style="background:${bg};border-radius:12px;padding:10px 8px;text-align:center">
        <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:${col}">${n}</div>
        <div style="font-size:10px;color:${col};opacity:.8">${l}</div>
      </div>`).join('')}
    </div>
    <!-- Premium Banner -->
    ${!ME.premium?`<div style="background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openPayment()">
      <span style="font-size:28px">👑</span>
      <div style="color:#fff;flex:1"><div style="font-weight:700;font-size:14px">Upgrade to Premium</div><div style="font-size:12px;opacity:.8">Get unlimited matches & more</div></div>
      <span style="color:#fff;font-size:18px">→</span>
    </div>`:''}
    <!-- Today's Pick -->
    <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px">✨ Today's Top Matches</div>
    ${visibleProfiles.slice(0,PROFILES.length).map(p=>renderProfileCardHTML(p)).join('')}
  </div>`;
}

function renderProfileCardHTML(p){
  const isSent=sentRequests.includes(p.id);
  const isLiked=likedIds.includes(p.id);
  return `<div style="margin-bottom:14px;animation:cardIn .4s ease">
    <div class="pcard" onclick="openProfileView(${p.id})">
      <img src="${p.img}" class="pcard-img" alt="${p.name}"/>
      <div class="pcard-grad"></div>
      <div class="pcard-badges">
        <span class="badge-match">${p.match}% Match</span>
        ${p.verified?'<span class="badge-verified">✓ Verified</span>':''}
        ${p.premium?'<span class="badge-premium">👑 Premium</span>':''}
      </div>
      <div class="pcard-info">
        <div class="pcard-name">${p.name}, ${p.age}</div>
        <div class="pcard-sub">📍 ${p.city}, ${p.state} · ${p.distance} km · ${p.profession}</div>
        <div class="pcard-tags">${p.tags.map(t=>`<span class="pcard-tag">${t}</span>`).join('')}</div>
      </div>
    </div>
    <div class="action-row">
      <button class="act-btn act-ignore" onclick="ignoreProfile(${p.id})">✕ Ignore</button>
      <button class="act-btn act-notint" onclick="notInterested(${p.id})">👎 Not Int.</button>
      <button class="act-btn act-shortlist" onclick="shortlistProfile(${p.id})">⭐ Save</button>
      <button class="act-btn act-interested ${isSent?'act-accepted':''}" id="int-btn-${p.id}" onclick="sendInterest(${p.id})">
        ${isSent?'✓ Sent':'💌 Interest'}</button>
    </div>
  </div>`;
}

function ignoreProfile(id){
  ignoredIds.push(id);
  const el=document.querySelector(`[onclick="ignoreProfile(${id})"]`);
  if(el){const card=el.closest('[style*="animation"]');if(card){card.style.opacity='0';card.style.transform='translateX(-100%)';card.style.transition='all .4s';setTimeout(()=>card.remove(),400);}}
  showToast('Profile ignored');
}
function notInterested(id){
  notIntIds.push(id);
  showToast('Marked as not interested');
  const el=document.querySelector(`[onclick="notInterested(${id})"]`);
  if(el){const card=el.closest('[style*="animation"]');if(card){card.style.opacity='0';card.style.transition='opacity .4s';setTimeout(()=>card.remove(),400);}}
}
function shortlistProfile(id){showToast('⭐ Profile saved to shortlist!');}
function sendInterest(id){
  if(sentRequests.includes(id)){showToast('Request already sent');return;}
  sentRequests.push(id);
  const btn=document.getElementById('int-btn-'+id);
  if(btn){btn.textContent='✓ Sent';btn.classList.remove('act-interested');btn.classList.add('act-accepted',);}
  document.getElementById('req-badge').textContent=sentRequests.length;
  showToast('💌 Interest sent successfully!');
}

